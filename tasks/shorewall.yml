---
# Shorewall tasks file for Myatu.shorewall

- name: Combine all Shorewall configuration variables
  set_fact:
    shorewall_conf: "{{ shorewall_conf_defaults|combine(shorewall_conf, recursive=True) }}"

- name: Install Shorewall and dependencies
  package:
    name: "{{ item }}"
    state: present
  with_items: "{{ shorewall_packages }}"
  notify:
    - enable shorewall
  tags:
    - packages
  when: shorewall_install_packages | bool

- name: Generate Shorewall essential configuration files
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - shorewall.conf
    - interfaces
    - zones
    - policy
    - rules
  notify:
    - restart shorewall
  tags:
    - configuration

- name: Generate Shorewall params configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - params
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_params is defined

- name: Generate Shorewall routes configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - routes
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_routes is defined

- name: Generate Shorewall tcinterfaces configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - tcinterfaces
  notify:
    - restart shorewall
  tags:
    - configuration
  when: (shorewall_tcinterfaces is defined) and (shorewall6_tcinterfaces is not defined)

- name: Generate Shorewall actions configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - actions
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_actions is defined

- name: Generate Shorewall hosts configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - hosts
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_hosts is defined

- name: Generate Shorewall providers configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - providers
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_providers is defined

- name: Generate Shorewall rtrules configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - rtrules
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_rtrules is defined

- name: Generate Shorewall mangle configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - mangle
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_mangle is defined

- name: Generate Shorewall tunnels configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - tunnels
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_tunnels is defined

- name: Generate Shorewall stoppedrules configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - stoppedrules
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_stoppedrules is defined

- name: Generate Shorewall nat configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - nat
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_nat is defined

- name: Generate Shorewall accounting configuration file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - accounting
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_accounting is defined

- name: Generate Shorewall snat file
  template:
    dest: "/etc/shorewall/{{ item }}"
    src: "shorewall/{{ item }}.j2"
    owner: root
    group: root
    mode: 0640
  with_items:
    - snat
  notify:
    - restart shorewall
  tags:
    - configuration
  when: shorewall_snat is defined

- name: Remove optional Shorewall configuration files when vars are undefined
  file:
    path: "/etc/shorewall/{{ item.name }}"
    state: absent
  loop:
    - { name: params, enabled: "{{ shorewall_params is defined }}" }
    - { name: routes, enabled: "{{ shorewall_routes is defined }}" }
    - { name: tcinterfaces, enabled: "{{ (shorewall_tcinterfaces is defined) and (shorewall6_tcinterfaces is not defined) }}" }
    - { name: actions, enabled: "{{ shorewall_actions is defined }}" }
    - { name: hosts, enabled: "{{ shorewall_hosts is defined }}" }
    - { name: providers, enabled: "{{ shorewall_providers is defined }}" }
    - { name: rtrules, enabled: "{{ shorewall_rtrules is defined }}" }
    - { name: mangle, enabled: "{{ shorewall_mangle is defined }}" }
    - { name: tunnels, enabled: "{{ shorewall_tunnels is defined }}" }
    - { name: stoppedrules, enabled: "{{ shorewall_stoppedrules is defined }}" }
    - { name: nat, enabled: "{{ shorewall_nat is defined }}" }
    - { name: accounting, enabled: "{{ shorewall_accounting is defined }}" }
    - { name: snat, enabled: "{{ shorewall_snat is defined }}" }
  when: not (item.enabled | bool)
  notify:
    - restart shorewall
  tags:
    - configuration

- name: Verify Shorewall configuration
  command: shorewall check
  changed_when: False
  tags:
    - tests

- name: Generate Shorewall service configuration
  template:
    dest: /etc/default/shorewall
    src: default/shorewall.j2
    owner: root
    group: root
    mode: 0640
  notify:
    - restart shorewall
  tags:
    - configuration

- name: Enable Shorewall service in systemd
  systemd:
    name: shorewall
    enabled: yes
    masked: no
