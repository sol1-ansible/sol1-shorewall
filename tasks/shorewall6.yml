---
# Shorewall6 tasks file for Myatu.shorewall6

- name: Combine all Shorewall6 configuration variables
  set_fact:
    shorewall6_conf: "{{ shorewall6_conf_defaults|combine(shorewall6_conf, recursive=True) }}"

- name: Install Shorewall6 and dependencies
  package:
    name: "{{ item }}"
    state: present
  with_items: "{{ shorewall6_packages }}"
  notify: 
    - enable shorewall6
  tags:
    - packages
  when: shorewall6_install_packages | bool

- block:
  - name: Generate Shorewall6 essential configuration files
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - shorewall6.conf
      - interfaces
      - zones
      - policy
      - rules
    notify:
      - restart shorewall6
    tags:
      - configuration

  - name: Generate Shorewall6 params configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - params
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_params is defined

  - name: Generate Shorewall6 routes configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - routes
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_routes is defined

  - name: Generate Shorewall6 tcinterfaces configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - tcinterfaces
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: (shorewall6_tcinterfaces is defined) and (shorewall_tcinterfaces is not defined)

  - name: Generate Shorewall6 actions configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - actions
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_actions is defined

  - name: Generate Shorewall6 hosts configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - hosts
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_hosts is defined

  - name: Generate Shorewall6 providers configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - providers
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_providers is defined

  - name: Generate Shorewall6 rtrules configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - rtrules
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_rtrules is defined

  - name: Generate Shorewall6 mangle configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - mangle
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_mangle is defined

  - name: Generate Shorewall6 tunnels configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - tunnels
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_tunnels is defined

  - name: Generate Shorewall6 stoppedrules configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - stoppedrules
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_stoppedrules is defined

  - name: Generate Shorewall6 nat configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - nat
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_nat is defined

  - name: Generate Shorewall6 accounting configuration file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - accounting
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_accounting is defined

  - name: Generate Shorewall6 snat file
    template:
      dest: "/etc/shorewall6/{{ item }}"
      src: "shorewall6/{{ item }}.j2"
      owner: root
      group: root
      mode: 0640
    with_items:
      - snat
    notify:
      - restart shorewall6
    tags:
      - configuration
    when: shorewall6_snat is defined

  - name: Remove optional Shorewall6 configuration files when vars are undefined
    file:
      path: "/etc/shorewall6/{{ item.name }}"
      state: absent
    loop:
      - { name: params, enabled: "{{ shorewall6_params is defined }}" }
      - { name: routes, enabled: "{{ shorewall6_routes is defined }}" }
      - { name: tcinterfaces, enabled: "{{ (shorewall6_tcinterfaces is defined) and (shorewall_tcinterfaces is not defined) }}" }
      - { name: actions, enabled: "{{ shorewall6_actions is defined }}" }
      - { name: hosts, enabled: "{{ shorewall6_hosts is defined }}" }
      - { name: providers, enabled: "{{ shorewall6_providers is defined }}" }
      - { name: rtrules, enabled: "{{ shorewall6_rtrules is defined }}" }
      - { name: mangle, enabled: "{{ shorewall6_mangle is defined }}" }
      - { name: tunnels, enabled: "{{ shorewall6_tunnels is defined }}" }
      - { name: stoppedrules, enabled: "{{ shorewall6_stoppedrules is defined }}" }
      - { name: nat, enabled: "{{ shorewall6_nat is defined }}" }
      - { name: accounting, enabled: "{{ shorewall6_accounting is defined }}" }
      - { name: snat, enabled: "{{ shorewall6_snat is defined }}" }
    when: not (item.enabled | bool)
    notify:
      - restart shorewall6
    tags:
      - configuration

  - name: Verify Shorewall6 configuration
    command: shorewall6 check
    changed_when: False
    tags:
      - tests

  - name: Generate Shorewall6 service configuration
    template:
      dest: /etc/default/shorewall6
      src: default/shorewall6.j2
      owner: root
      group: root
      mode: 0640
    notify:
      - restart shorewall6
    tags:
      - configuration
 
  - name: Enable Shorewall6 service in systemd
    systemd:
      name: shorewall6
      enabled: yes
      masked: no
 
